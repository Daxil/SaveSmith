[project]
name = "savesmith"
version = "0.1.0"
description = "Save file editor for offline games, including games no editor exists for yet"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=50.0.0",
    "msgpack>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["savesmith"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "native_windows: requires a real Windows host (skipped elsewhere)",
    "native_macos: requires a real macOS host (skipped elsewhere)",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use asserts freely.
"tests/*" = ["N802"]

# --------------------------------------------------------------------------
# mypy — strict for the core, lenient elsewhere for now
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["savesmith", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "savesmith.core.*"
strict = true

# msgpack ships no type information.
[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true
