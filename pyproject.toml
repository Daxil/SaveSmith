[project]
name = "savesmith"
version = "0.1.0"
description = "Save file editor for offline games, including games no editor exists for yet"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # AES only, and it carries its own: cryptography drags OpenSSL along and
    # links to the system copy on some macOS builds, which killed the packaged
    # binary at startup.
    "pycryptodome>=3.20",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
# Only 'savesmith discover --model' needs this: it asks a model to write a
# codec for a format nothing built in can read. Every known format, every
# edit and every backup works without it, offline and free.
model = ["anthropic>=0.40"]

[project.scripts]
savesmith = "savesmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["savesmith"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.21.0",
]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "native_windows: requires a real Windows host (skipped elsewhere)",
    "native_macos: requires a real macOS host (skipped elsewhere)",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    # This project ships Russian user-facing strings; Cyrillic letters that
    # look like Latin ones are the point, not a mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use asserts freely.
"tests/*" = ["N802"]

# --------------------------------------------------------------------------
# mypy — strict for the core, lenient elsewhere for now
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["savesmith", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "savesmith.core.*"
strict = true

# msgpack ships no type information.
[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true
