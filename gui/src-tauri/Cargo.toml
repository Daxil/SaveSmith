[package]
name = "savesmith-gui"
version = "0.1.0"
description = "SaveSmith — редактор сохранений для одиночных игр"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync"] }

# The shell exists to carry messages, not to be fast. Optimising for size keeps
# the download small, which matters more to somebody grabbing one file from a
# CI artifact than a few milliseconds of startup ever will.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
