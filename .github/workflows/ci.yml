name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A job that never starts is worse than one that fails: it hangs the whole
    # run with nothing to read. This bounds the ones that do start.
    timeout-minutes: 30
    strategy:
      # Windows-only breakage must not hide a macOS failure, and the reverse.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          # macos-13 was retired outright and macos-14 is deprecated; a job
          # asking for a runner that no longer exists queues until it times
          # out, which reads as "CI is stuck" rather than as a broken label.
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: CI must fail on an out-of-date lock file rather than
      # silently resolving different versions than the developer ran.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      # Type-check the Windows view from every runner. Typeshed marks modules
      # like `resource` as POSIX-only, so a Mac can catch a Windows-only type
      # error before the Windows job even starts — the same trick the tests use
      # to exercise Windows behaviour from a Mac.
      - name: Types as Windows
        run: uv run mypy --platform win32

      # Tests marked native_windows / native_macos skip themselves off their
      # host, so one command covers every runner.
      - name: Tests
        run: uv run pytest -q

      # Prints what the resolver sees on a real runner. The value is the log:
      # it shows the actual known-folder paths Windows hands back, which no
      # amount of mocking can confirm.
      - name: Diagnostics smoke
        run: uv run python -m savesmith.core.diagnostics

      # A packaged build fails differently from a source one — missing data
      # files, imports that only happen for their side effect — so it is built
      # and run on every platform rather than only before a release.
      - name: Build the binary
        run: uv run pyinstaller savesmith.spec --noconfirm --log-level WARN

      - name: The binary works
        shell: bash
        run: |
          BINARY=dist/savesmith
          [ -f "$BINARY.exe" ] && BINARY="$BINARY.exe"
          "$BINARY" plugins
          "$BINARY" identify tests/corpus/unreal-gvas/the-invincible/ComicsSave.sav

      - uses: actions/upload-artifact@v4
        with:
          name: savesmith-${{ matrix.os }}
          path: dist/savesmith*
          if-no-files-found: error

  # The window, and the shell around it. Kept apart from `test` so that a
  # broken Rust toolchain cannot hide a failing core test, and so the core
  # keeps building on machines that have no Rust at all.
  app:
    name: App, ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Compiling the shell from scratch is slow the first time and cached
    # afterwards; 45 leaves room for the cold run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15
            label: macOS arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # The same binary the previous job built and proved, rather than a second
      # one built differently here. The window and the command line have to be
      # the same program or a bug fixed in one survives in the other.
      - uses: actions/download-artifact@v4
        with:
          name: savesmith-${{ matrix.os }}
          path: dist

      - name: The backend is executable
        if: runner.os != 'Windows'
        run: chmod +x dist/savesmith

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      # Before anything cargo does: the build script checks that the declared
      # externalBin is really there, so a missing sidecar fails the lint rather
      # than the bundling, ten minutes later.
      - name: Put the backend where Tauri looks for it
        working-directory: gui
        run: npm run sidecar

      - name: Lint the shell
        working-directory: gui/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Frontend tests
        working-directory: gui
        run: npm test

      # Runs tsc, builds the frontend, copies the backend in as a sidecar and
      # bundles the lot.
      - name: Build the app
        working-directory: gui
        run: npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: savesmith-app-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
