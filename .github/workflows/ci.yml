name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows-only breakage must not hide a macOS failure, and the reverse.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS arm64
          - os: macos-13
            label: macOS x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: CI must fail on an out-of-date lock file rather than
      # silently resolving different versions than the developer ran.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      # Tests marked native_windows / native_macos skip themselves off their
      # host, so one command covers every runner.
      - name: Tests
        run: uv run pytest -q
