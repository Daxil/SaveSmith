name: CI

on:
  push:
    branches: [main]
    # A release is a tag, and the tag runs the same build the branch does.
    # Building release files by a separate path would mean shipping something
    # no test ever ran against.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A job that never starts is worse than one that fails: it hangs the whole
    # run with nothing to read. This bounds the ones that do start.
    timeout-minutes: 30
    strategy:
      # Windows-only breakage must not hide a macOS failure, and the reverse.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          # macos-13 was retired outright and macos-14 is deprecated; a job
          # asking for a runner that no longer exists queues until it times
          # out, which reads as "CI is stuck" rather than as a broken label.
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: CI must fail on an out-of-date lock file rather than
      # silently resolving different versions than the developer ran.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      # Type-check the Windows view from every runner. Typeshed marks modules
      # like `resource` as POSIX-only, so a Mac can catch a Windows-only type
      # error before the Windows job even starts — the same trick the tests use
      # to exercise Windows behaviour from a Mac.
      - name: Types as Windows
        run: uv run mypy --platform win32

      # Tests marked native_windows / native_macos skip themselves off their
      # host, so one command covers every runner.
      - name: Tests
        run: uv run pytest -q

      # Prints what the resolver sees on a real runner. The value is the log:
      # it shows the actual known-folder paths Windows hands back, which no
      # amount of mocking can confirm.
      - name: Diagnostics smoke
        run: uv run python -m savesmith.core.diagnostics

      # A packaged build fails differently from a source one — missing data
      # files, imports that only happen for their side effect — so it is built
      # and run on every platform rather than only before a release.
      - name: Build the binary
        run: uv run pyinstaller savesmith.spec --noconfirm --log-level WARN

      - name: The binary works
        shell: bash
        run: |
          BINARY=dist/savesmith
          [ -f "$BINARY.exe" ] && BINARY="$BINARY.exe"
          "$BINARY" plugins
          "$BINARY" identify tests/corpus/unreal-gvas/the-invincible/ComicsSave.sav

      - uses: actions/upload-artifact@v4
        with:
          name: savesmith-${{ matrix.os }}
          path: dist/savesmith*
          if-no-files-found: error

  # Whether a release could be published, asked on every push rather than
  # discovered at tag time.
  #
  # A secret cannot be read back by anybody, including whoever set it, so the
  # only way to know it is there is to look for it from inside a workflow. Left
  # unchecked, a missing key surfaces half an hour into a tagged build, after
  # the tests and three app builds have run — which is half an hour after it
  # was worth knowing.
  release_readiness:
    name: Ready to release?
    runs-on: ubuntu-latest
    # Secrets are withheld from pull requests raised off a fork, so asking
    # there would report a problem that does not exist.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    steps:
      # Set, and the right thing. "Not empty" is a weak question: the public
      # half of the pair sits in the same folder under a name one character
      # longer, and pasting that one produces a secret that passes every check
      # until a tagged build fails at the very end, after three app builds.
      # Nothing here prints the value; only which kind of key it turned out to
      # be.
      - name: The updater key is where a release will look for it
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=No updater key::TAURI_SIGNING_PRIVATE_KEY is not set." \
                 "Tagging a release now would fail on purpose, because the app it built" \
                 "could never update itself. Settings → Secrets and variables → Actions."
            exit 0
          fi

          # Judged after the same cleaning the build does, or this would warn
          # about a secret that is going to work perfectly well.
          KEY=$(printf '%s' "$KEY" | tr -cd 'A-Za-z0-9+/=')
          kind=$(printf '%s' "$KEY" | base64 -d 2>/dev/null | head -c 200 | tr -d '\0')
          # A key cut short still decodes to its own comment line, so the
          # length is checked too: the real thing is around 350 characters.
          case "$kind" in
            *"rsign encrypted secret key"*)
              if [ "${#KEY}" -lt 200 ]; then
                echo "::warning title=Updater key looks cut short::The secret starts like a" \
                     "signing key but is only ${#KEY} characters; the whole file is longer." \
                     "Copy it all: pbcopy < ~/.tauri/savesmith-updater.key"
                exit 0
              fi
              echo "TAURI_SIGNING_PRIVATE_KEY holds a signing key. A release can be published."
              ;;
            *"minisign public key"*)
              echo "::warning title=That is the public half::TAURI_SIGNING_PRIVATE_KEY holds" \
                   "the *public* key — the file ending in .pub. Signing needs the other one," \
                   "~/.tauri/savesmith-updater.key, and a tagged build will fail without it."
              ;;
            *)
              echo "::warning title=Unreadable updater key::TAURI_SIGNING_PRIVATE_KEY is set" \
                   "but is not a key Tauri can sign with — most likely pasted partially." \
                   "Copy the whole file: pbcopy < ~/.tauri/savesmith-updater.key"
              ;;
          esac

  # The Homebrew cask, checked by Homebrew itself.
  #
  # It is the one install path where nobody sees "SaveSmith is damaged", so a
  # typo in it costs more than a typo elsewhere: the person who used it is
  # exactly the person who would otherwise have been stopped. Homebrew's own
  # audit is the only thing that knows the current rules of the DSL.
  cask:
    name: Cask
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew reads it and agrees
        run: |
          # `brew audit` takes a name, not a path — a cask is only a cask once
          # it is in a tap. Tapped from this checkout rather than from GitHub,
          # so what gets audited is the change being tested and not whatever
          # main happened to hold.
          brew tap daxil/savesmith "$GITHUB_WORKSPACE"
          brew audit --cask --strict --online daxil/savesmith/savesmith

  # The window, and the shell around it. Kept apart from `test` so that a
  # broken Rust toolchain cannot hide a failing core test, and so the core
  # keeps building on machines that have no Rust at all.
  app:
    name: App, ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Compiling the shell from scratch is slow the first time and cached
    # afterwards; 45 leaves room for the cold run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15
            label: macOS arm64
          # An Intel Mac got the command line and no window at all, which is a
          # strange thing to tell somebody: the same program, and the half with
          # the buttons is missing.
          - os: macos-15-intel
            label: macOS x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # The same binary the previous job built and proved, rather than a second
      # one built differently here. The window and the command line have to be
      # the same program or a bug fixed in one survives in the other.
      - uses: actions/download-artifact@v4
        with:
          name: savesmith-${{ matrix.os }}
          path: dist

      - name: The backend is executable
        if: runner.os != 'Windows'
        run: chmod +x dist/savesmith

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      # Before anything cargo does: the build script checks that the declared
      # externalBin is really there, so a missing sidecar fails the lint rather
      # than the bundling, ten minutes later.
      - name: Put the backend where Tauri looks for it
        working-directory: gui
        run: npm run sidecar

      - name: Lint the shell
        working-directory: gui/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Frontend tests
        working-directory: gui
        run: npm test

      # Runs tsc, builds the frontend, copies the backend in as a sidecar and
      # bundles the lot.
      - name: Build the app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: gui
        run: npm run app:build

      # A tag build additionally produces what the installed app downloads when
      # it updates itself, each piece signed with the updater key. Kept to tags
      # because signing needs the private key, and a branch build must stay
      # green for anyone who does not have it — a fork, or a pull request.
      - name: Build the app, with an update people can install
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, so this release" \
                 "would ship an app that can never update itself. Add the secret."
            exit 1
          fi

          # Keep only what base64 is made of, and drop everything else.
          #
          # Two real failures, half an hour into a tagged build each. First a
          # newline on the end, because a web form adds one. Then a stray '%'
          # at offset 348 — the key file has no final newline, zsh prints a '%'
          # to say so, and copying the line out of a terminal takes the '%'
          # along. Base64 has an alphabet; anything outside it is somebody's
          # terminal, not their key.
          export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" \
            | tr -cd 'A-Za-z0-9+/=')"

          # The reason goes into the run summary, not only into the log.
          # Downloading a workflow log needs admin rights on the repository, so
          # for anybody else — a contributor, or the maintainer on a phone — a
          # failed release is otherwise a red cross with nothing behind it.
          set -o pipefail
          if ! npx tauri build --config src-tauri/tauri.release.conf.json 2>&1 \
               | tee "$RUNNER_TEMP/tauri.log"; then
            # The lines that say what went wrong, not the last lines of the
            # build. A tail catches whatever the bundler was printing when it
            # died — usually a list of asset sizes — and buries the one line
            # that matters under it.
            said=$(grep -iE 'error|failed|panicked|not found|no such' \
                     "$RUNNER_TEMP/tauri.log" \
                   | sed 's/\x1b\[[0-9;]*m//g' | tail -n 8 | tr '\n' '|')
            echo "::error title=Не собралось окно::${said:-$(tail -n 5 "$RUNNER_TEMP/tauri.log")}"
            exit 1
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: savesmith-app-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            gui/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  # A tag becomes a page with files on it and a permanent link. Without this a
  # download means "open Actions, find a green run, scroll to the bottom, sign
  # in" — four steps and an account, to fetch a save editor.
  release:
    name: Release
    needs: [test, app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Full history: this job pushes the cask update back to main, and a
      # shallow clone cannot push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag says one version and the files carry another only once before
      # somebody downloads "0.2.0" and gets 0.1.0. Four files hold the number;
      # all four are checked against the tag rather than trusted.
      - name: The tag and the code agree on the version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if ! grep -qF "$2" "$1"; then
              echo "::error file=$1::says something other than $VERSION"
              fail=1
            fi
          }
          check pyproject.toml "version = \"$VERSION\""
          check gui/package.json "\"version\": \"$VERSION\""
          check gui/src-tauri/Cargo.toml "version = \"$VERSION\""
          check gui/src-tauri/tauri.conf.json "\"version\": \"$VERSION\""
          exit $fail

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Downloaded, every file is called savesmith or SaveSmith_0.1.0.dmg, and
      # how deeply they are nested depends on which patterns happened to match
      # — so they are searched for rather than reached by path. On a release
      # page a file has to say what it is without its folder.
      - name: Name the files after what they are
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          # take <artifact> <pattern> <new name>
          take() {
            local found
            found=$(find "artifacts/$1" -name "$2" -type f -print -quit)
            if [ -z "$found" ]; then
              echo "::error::$2 is missing from $1"
              exit 1
            fi
            cp "$found" "release/$3"
          }

          take savesmith-windows-latest    'savesmith.exe' "savesmith-$VERSION-windows-x64.exe"
          take savesmith-macos-15          'savesmith'     "savesmith-$VERSION-macos-arm64"
          take savesmith-macos-15-intel    'savesmith'     "savesmith-$VERSION-macos-x64"

          take savesmith-app-windows-latest '*-setup.exe' "SaveSmith-$VERSION-windows-x64-setup.exe"
          take savesmith-app-macos-15       '*.dmg'       "SaveSmith-$VERSION-macos-arm64.dmg"
          take savesmith-app-macos-15-intel '*.dmg'       "SaveSmith-$VERSION-macos-x64.dmg"

          # What the installed app downloads when it updates itself, with the
          # detached signature beside each one.
          #
          # Renamed by hand, and this is not cosmetic: Tauri calls the macOS
          # update SaveSmith.app.tar.gz on both architectures, so collecting
          # them into one folder would have an Apple Silicon build quietly
          # overwrite the Intel one and half the users would update into a
          # program their machine cannot run.
          updater() { # <artifact> <new base name>
            local tarball
            tarball=$(find "artifacts/$1" -name '*.app.tar.gz' -type f -print -quit)
            [ -n "$tarball" ] || return 0
            cp "$tarball" "release/$2"
            cp "$tarball.sig" "release/$2.sig"
          }
          updater savesmith-app-macos-15       "SaveSmith-$VERSION-macos-arm64.app.tar.gz"
          updater savesmith-app-macos-15-intel "SaveSmith-$VERSION-macos-x64.app.tar.gz"

          # The Windows update is the same installer a first-time user runs, so
          # its signature travels under the name that installer now has.
          setup_sig=$(find artifacts/savesmith-app-windows-latest -name '*-setup.exe.sig' \
            -type f -print -quit)
          if [ -n "$setup_sig" ]; then
            cp "$setup_sig" "release/SaveSmith-$VERSION-windows-x64-setup.exe.sig"
          fi
          ls -la release

      # The installed app asks one URL whether there is a newer version. Built
      # from the files just collected, so it can never name one that is not
      # there — a manifest pointing at a missing file turns every update into a
      # failed download.
      - name: The file the installed app asks
        run: |
          node gui/scripts/updater-manifest.mjs "${GITHUB_REF_NAME#v}" release \
            "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          mv latest.json release/
          cat release/latest.json

      # So that somebody who downloaded over a bad connection can tell, and so
      # that "is this the file you built?" has an answer.
      - name: Checksums
        working-directory: release
        run: shasum -a 256 * > SHA256SUMS.txt

      - name: Write the release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            sed "s/{VERSION}/$VERSION/g" docs/release-body.md
            echo
            echo "---"
            echo
            # Whatever was written in the tag message, if anything was.
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "SaveSmith $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      # A cask that still points at last month's build installs last month's
      # build, quietly, for everybody who uses that path. Rewritten from the
      # files just published rather than by anybody remembering to.
      - name: Point the Homebrew cask at what was just published
        # Never worth failing a published release over.
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          arm=$(shasum -a 256 "release/SaveSmith-$VERSION-macos-arm64.dmg" | cut -d' ' -f1)
          intel=$(shasum -a 256 "release/SaveSmith-$VERSION-macos-x64.dmg" | cut -d' ' -f1)
          python3 - "$VERSION" "$arm" "$intel" <<'PY'
          import pathlib, re, sys
          version, arm, intel = sys.argv[1:4]
          cask = pathlib.Path("Casks/savesmith.rb")
          text = cask.read_text()
          text = re.sub(r'version "[^"]*"', f'version "{version}"', text, count=1)
          text = re.sub(r'sha256 arm:   "[0-9a-f]*"', f'sha256 arm:   "{arm}"', text, count=1)
          text = re.sub(r'intel: "[0-9a-f]*"', f'intel: "{intel}"', text, count=1)
          cask.write_text(text)
          PY
          git diff --quiet Casks/savesmith.rb && { echo "cask already matches"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/savesmith.rb
          git commit -m "Cask указывает на $VERSION"
          # Onto main, not the tag: a tag is a fixed point, and the cask has to
          # move. Rebasing first so a commit pushed while the build ran is not
          # thrown away.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
